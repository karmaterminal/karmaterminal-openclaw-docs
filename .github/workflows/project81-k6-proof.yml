name: project81-k6-proof
run-name: project81-k6-proof ${{ inputs.rows }} dry=${{ inputs.dry_run }}

# Public/self-hostable Project 81 proof runner.
# Dry runs can execute on a generic GitHub runner. Live continuation rows need
# a runner with network access to the target OpenClaw gateway and k6 installed.

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Comma-separated row ids, 'all', or 'live-suite' for unattended k6-runnable rows"
        required: true
        default: "live-suite"
        type: string
      candidate_sha:
        description: "40-char deployed OpenClaw candidate SHA; required when dry_run=false"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run only; set false only when gateway env/secrets are configured"
        required: true
        default: true
        type: boolean
      runner_labels_json:
        description: 'JSON array for runs-on labels, e.g. ["self-hosted","cael"] or ["ubuntu-latest"]'
        required: true
        default: '["ubuntu-latest"]'
        type: string
      gateway_ws:
        description: "OpenClaw gateway WebSocket URL reachable from the runner"
        required: false
        default: "ws://127.0.0.1:18789"
        type: string
      session_selector:
        description: "Scratch/non-channel session selector for live proof rows"
        required: false
        default: "main"
        type: string
      seat_name:
        description: "Seat/reviewer label recorded in artifacts"
        required: false
        default: "external-reviewer"
        type: string
      create_disposable_sessions:
        description: "Create disposable proof sessions for rows that support it"
        required: true
        default: true
        type: boolean
      metrics_push:
        description: "Push public-safe proof metrics to OTLP endpoint during live runs"
        required: true
        default: false
        type: boolean
      metrics_otlp_endpoint:
        description: "OTLP/HTTP metrics endpoint"
        required: false
        default: ""
        type: string
      openclaw_alt_model:
        description: "Optional model override for model-override rows"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: project81-k6-proof-${{ github.ref }}-${{ inputs.rows }}-${{ inputs.dry_run }}
  cancel-in-progress: false

jobs:
  project81-k6-proof:
    name: project81 k6 proof
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 30
    env:
      OPENCLAW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      OPENCLAW_GATEWAY_WS: ${{ inputs.gateway_ws }}
      OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
      OPENCLAW_SESSION_KEY: ${{ inputs.session_selector }}
      OPENCLAW_SEAT_NAME: ${{ inputs.seat_name }}
      OPENCLAW_CREATE_DISPOSABLE_SESSION: ${{ inputs.create_disposable_sessions }}
      OPENCLAW_CREATE_DISPOSABLE_SESSIONS: ${{ inputs.create_disposable_sessions }}
      OPENCLAW_ALT_MODEL: ${{ inputs.openclaw_alt_model }}
      OPENCLAW_PROOFS_K6_OTLP_ENDPOINT: ${{ inputs.metrics_otlp_endpoint }}
      OPENCLAW_PROOFS_DOCS_REPOSITORY: ${{ github.repository }}
      DOCS_REF: ${{ github.sha }}
      K6_PROOF_OUT_DIR: ${{ github.workspace }}/project81-k6-proof-artifacts
    steps:
      - name: Checkout proof catalog
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate catalog and resolve rows
        id: rows
        shell: bash
        env:
          ROWS_INPUT: ${{ inputs.rows }}
          CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
          RUNNER_LABELS_JSON: ${{ inputs.runner_labels_json }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          node -e 'const v=JSON.parse(process.env.RUNNER_LABELS_JSON); if (!Array.isArray(v) || !v.every(x => typeof x === "string" && x.length)) throw new Error("runner_labels_json must be a JSON array of non-empty strings")'
          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ -z "$CANDIDATE_SHA_INPUT" ]] || ! printf '%s' "$CANDIDATE_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::candidate_sha must be a 40-char hex string when dry_run=false"
              exit 1
            fi
          fi
          node --check tools/k6-proofs/scripts/list-runnable-rows.mjs
          node --check tools/k6-proofs/scripts/summarize-review-debt.mjs
          # One repository-root contract (#495): these produce identical results
          # from the repository root and from tools/k6-proofs.
          node tools/k6-proofs/scripts/check-manifest-scenarios.mjs --repo-root "$GITHUB_WORKSPACE"
          node tools/k6-proofs/scripts/check-scenario-alignment.mjs --repo-root "$GITHUB_WORKSPACE"
          node tools/k6-proofs/scripts/check-proof-row-manifests.mjs --repo-root "$GITHUB_WORKSPACE"
          if [[ "$ROWS_INPUT" == "live-suite" ]]; then
            rows="$(node tools/k6-proofs/scripts/list-runnable-rows.mjs --live-suite)"
          elif [[ "$ROWS_INPUT" == "all" ]]; then
            rows="$(node tools/k6-proofs/scripts/list-runnable-rows.mjs)"
          else
            rows="$ROWS_INPUT"
          fi
          test -n "$rows"
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          echo "Resolved rows: $rows"

      - name: Resolve self-hosted k6
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v k6 >/dev/null && [[ -x "$HOME/bin/k6" ]]; then
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Check live prerequisites
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          command -v k6 >/dev/null || { echo "k6 is required for live runs: https://grafana.com/docs/k6/latest/set-up/install-k6/"; exit 1; }
          test -n "${OPENCLAW_GATEWAY_TOKEN:-}" || { echo "OPENCLAW_GATEWAY_TOKEN secret is required for live runs"; exit 1; }

      - name: Run Project 81 proof suite
        shell: bash
        run: |
          set -euo pipefail
          cd tools/k6-proofs
          mode="--dry-run"
          if [[ "${{ inputs.dry_run }}" == "false" ]]; then
            mode="--live"
          fi
          if [[ "${{ inputs.metrics_push }}" != "true" ]]; then
            unset OPENCLAW_PROOFS_K6_OTLP_ENDPOINT
          fi
          # Bind the matrix to the exact immutable docs/harness commit this job
          # checked out (#496). The runner freezes it before any row fires and
          # fails closed as harness infrastructure if the tree is stale or dirty.
          ./scripts/run-proofs.sh "$mode" --docs-ref "$DOCS_REF" "${{ steps.rows.outputs.rows }}" "${OPENCLAW_CANDIDATE_SHA:-}"

      - name: Summarize review debt
        if: ${{ always() && !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          cd tools/k6-proofs
          mkdir -p "$K6_PROOF_OUT_DIR"
          node scripts/summarize-review-debt.mjs --run-root "$K6_PROOF_OUT_DIR" | tee "$K6_PROOF_OUT_DIR/review-debt.txt"

      - name: Upload proof artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: project81-k6-proof-${{ github.run_id }}
          path: project81-k6-proof-artifacts/**
          if-no-files-found: warn
          retention-days: 30
