# Arm D: f9fcd3a5, direct-tools overlay: control-first text, every tool direct (arms.json). Optional, off by default.
# EvalBench copies this file into configs.csv, so it never holds a credential: the adapter reads the gateway token
# from the file named by OPENCLAW_EVAL_TOKEN_FILE_D in its own environment.
# The firing model is arms.json's `model`; a run writes it into its copy of this file as env.OPENCLAW_EVAL_MODEL.
generator: agent_grpc_proxy
generator_class: openclaw_evalbench.generator:OpenClawProxyGenerator
timeout_seconds: 900.0
env:
  OPENCLAW_EVAL_ARM: "D"
  OPENCLAW_EVAL_GATEWAY_URL: "ws://127.0.0.1:21206"
